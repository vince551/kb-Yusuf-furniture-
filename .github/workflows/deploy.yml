name: Deploy KB Yusuf Furniture to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install

      # GitHub Pages is a static host. Keep the Appwrite server API routes
      # in the repository for Vercel, but exclude them from the Pages export.
      - name: Exclude server API routes from static Pages build
        run: mv app/api app/api._server

      - run: npm run build

      - name: Copy furniture photography
        run: |
          shopt -s nullglob
          cp public/images/*.jpg out/images/ 2>/dev/null || true
          cp public/images/*.jpeg out/images/ 2>/dev/null || true
          cp public/images/*.png out/images/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
