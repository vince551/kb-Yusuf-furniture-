name: Deploy KB Yusuf Furniture to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install

      # GitHub Pages is static. Keep the server API routes in the repository
      # for Vercel, but move them completely outside the Next.js app tree
      # during the Pages export so route handlers cannot break the build.
      - name: Exclude server API routes from static Pages build
        run: |
          mkdir -p .github/pages-server-routes
          mv app/api .github/pages-server-routes/api

      - name: Build static site
        run: npm run build

      - name: Verify Pages output
        run: |
          test -f out/index.html
          test -f out/images/furniture-01.jpg
          test -f out/images/furniture-56.jpg

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
